server {
  listen 80;
  server_name shkoli.bg www.shkoli.bg localhost 127.0.0.1 _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/xml
    image/svg+xml;

  if ($host = www.shkoli.bg) {
    return 301 https://shkoli.bg$request_uri;
  }

  if ($request_uri ~ "^/(?!assets/|api/|favicon\\.ico)(.+)/+$") {
    return 301 $scheme://$http_host/$1;
  }

  location = / {
    return 301 /bg/shkoli;
  }

  location = /shkoli {
    return 301 /bg/shkoli;
  }

  location = /lyceums {
    return 301 /bg/lyceums;
  }

  location = /about {
    return 301 /bg/about;
  }

  location = /cookies {
    return 301 /bg/cookies;
  }

  location = /privacy-policy {
    return 301 /bg/privacy-policy;
  }

  location = /terms-and-conditions {
    return 301 /bg/terms-and-conditions;
  }

  location = /map {
    return 301 /bg/map;
  }

  location = /login {
    return 301 /bg/auth/login;
  }

  location = /register {
    return 301 /bg/auth/register;
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location ~* ^/sitemap-\d+\.xml$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /site-map.html {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|css|js|txt|xml|json)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location ~ ^/(bg|en)(?:/.*)?$ {
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
